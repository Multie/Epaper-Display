; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-bat-pro


[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:esp-bat-pro]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; CORE_DEBUG_LEVEL=0: die Fehlermeldungen des Frameworks enthalten sonst lokale
; Dateipfade (samt Benutzername) in der oeffentlich verteilten firmware.bin
build_flags = -w -D NOW_ESP32_RTC -D NOW_MILLIS -D CORE_DEBUG_LEVEL=0
; "default.csv" dieser Framework-Version hat bereits otadata+app0/app1 (OTA-faehig),
; explizit setzen damit sich das nicht mit einem Board-Default ohne OTA-Slots vertut
board_build.partitions = default.csv
lib_deps =
	Wire
	Spi
	multie/Universaltime@^1.0.8
	bblanchon/ArduinoJson@^7