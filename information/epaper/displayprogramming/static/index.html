<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Epaper Test</title>
    <meta name="description" content="A simple HTML5 Template for new projects.">
    <meta name="author" content="SitePoint">

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="root">
        <div class="sidebar" id="OptionsAddDiv">
            <div class="itemGroupVertical">
                <div class="item">
                    <div class="itemLabel">
                        Url
                    </div>
                    <div class="itemValue">
                        <input id="UrlInput">
                    </div>
                </div>
                <div class="item">
                    <div class="itemLabel">
                        Zoom
                    </div>
                    <div class="itemValue">
                        <input id="ZoomInput" type="number" min="1" max="500">
                    </div>
                </div>
            </div>
        </div>
        <div class="center">
            <div class="displayContainer">
                <div id="displayWrapper">
                    <canvas id="displayCanvas" class="displayCanvas" width="400" height="300"></canvas>
                </div>


            </div>
            <div class="itemGroup itemOutput">
                <div class="item">
                    <div class="itemValue">
                        <button onclick="Unhide()">Unhide</button>
                        <button onclick="UpdateDisplay()">Refresh</button>
                        <button onclick="UploadDisplayData()">Set</button>
                    </div>
                </div>
                <div class="item">
                    <div class="itemLabel">
                        Output Char
                    </div>
                    <div class="itemValue wide">

                        <button onclick="LoadTextClear()">Load</button>
                    </div>
                </div>
                <div class="item">
                    <div class="itemValue wide">
                        <textarea class="textarea" id="outputTextareaChar"></textarea>
                    </div>
                </div>
                <div class="item">
                    <div class="itemLabel">
                        Output Hex

                    </div>
                    <div class="itemValue wide">
                        <button onclick="LoadHexClear()">Load</button>
                    </div>
                </div>
                <div class="item">

                    <div class="itemValue wide">
                        <textarea class="textarea" id="outputTextareaHex"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar right" id="OptionsDiv">

        </div>
    </div>


    <script src="scripts.js"></script>
</body>

</html>
